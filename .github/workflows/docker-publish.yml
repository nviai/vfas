name: Docker image

# Publishes the prebuilt image to the GitHub Container Registry:
#   tag vX.Y.Z  -> ghcr.io/<owner>/vfas:X.Y.Z, X.Y, X, latest
#   push to main -> ghcr.io/<owner>/vfas:edge
# Multi-arch (linux/amd64, linux/arm64), with SBOM and provenance
# attestations, signed with cosign (keyless, GitHub OIDC).

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless signing
    steps:
      - uses: actions/checkout@v4

      - name: Image name (lowercase owner)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Smoke test (amd64) before publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: vfas:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the hardened container and check /healthz
        run: |
          docker run -d --name vfas --read-only --tmpfs /tmp:size=256m --cap-drop ALL \
            --security-opt no-new-privileges:true -p 127.0.0.1:8000:8000 vfas:smoke
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/healthz && exit 0; sleep 2; done
          docker logs vfas; exit 1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=VFAS
            org.opencontainers.image.vendor=NVIAI CO., LTD.

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@v3
      - name: Sign the image (every tag points to this digest)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
