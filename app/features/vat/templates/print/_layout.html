{# Print layout for tax and receivable/payable reports. Always
   Vietnamese; does not use the translation function. #}
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>{% block title %}{% endblock %}</title>
<style>
  @page {
    {% block page_size %}size: A4 portrait; margin: 14mm 12mm 14mm 16mm;{% endblock %}
    @bottom-right { content: "Trang " counter(page) "/" counter(pages); font-family: "Times New Roman", "Liberation Serif", "DejaVu Serif", serif; font-size: 8pt; color: #333; }
  }
  * { box-sizing: border-box; }
  html { font-family: "Times New Roman", "Liberation Serif", "Tinos", "DejaVu Serif", serif; font-size: 10.5pt; color: #000; line-height: 1.3; }
  body { margin: 0; }
  p { margin: 0; }
  .b { font-weight: bold; } .i { font-style: italic; } .c { text-align: center; } .r { text-align: right; }
  .small { font-size: 8.5pt; }
  .nation { text-align: center; font-weight: bold; } .motto { text-align: center; font-weight: bold; text-decoration: underline; }
  .doc-head { width: 100%; border-collapse: collapse; margin-bottom: 3mm; }
  .doc-head td { vertical-align: top; padding: 0; }
  .doc-head .left { width: 58%; } .doc-head .right { width: 42%; text-align: center; }
  .title { text-align: center; font-weight: bold; font-size: 13.5pt; margin-top: 3mm; }
  .subtitle { text-align: center; margin-top: 1mm; }
  table.grid { width: 100%; border-collapse: collapse; margin-top: 3mm; table-layout: fixed; }
  table.grid th, table.grid td { border: .6pt solid #000; padding: 1mm 1.3mm; vertical-align: top; overflow-wrap: break-word; }
  table.grid th { font-weight: bold; text-align: center; vertical-align: middle; font-size: 9.5pt; }
  table.grid td.num { text-align: right; white-space: nowrap; }
  table.grid td.code { text-align: center; white-space: nowrap; }
  table.grid tr { page-break-inside: avoid; }
  table.grid tr.head td { font-weight: bold; }
  table.grid tr.total td { font-weight: bold; }
  .info p { margin: .6mm 0; }
  .signatures { width: 100%; border-collapse: collapse; margin-top: 5mm; page-break-inside: avoid; }
  .signatures td { text-align: center; vertical-align: top; padding: 0 2mm; }
  .signatures .role { font-weight: bold; } .signatures .hint { font-style: italic; font-size: 9pt; }
  .signatures .name { font-weight: bold; padding-top: 18mm; }
  .note { margin-top: 3mm; font-size: 9pt; font-style: italic; }
  {% block css %}{% endblock %}
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
