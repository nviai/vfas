{#- icon(name, cls="size-4", stroke=1.75, label=None): inline SVG colored with currentColor. label → role="img" + aria-label. -#}
{% macro icon(name, cls="size-4", stroke=1.75, label=None) -%}
<svg class="{{ cls }} shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ stroke }}" stroke-linecap="round" stroke-linejoin="round" {% if label %}role="img" aria-label="{{ label }}"{% else %}aria-hidden="true"{% endif %}>{{ (ICONS.get(name) or ICONS.get(ICON_ALIASES.get(name, ""), ""))|safe }}</svg>
{%- endmacro %}
